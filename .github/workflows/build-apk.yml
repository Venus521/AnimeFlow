name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK (no secrets required)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Show versions
        run: flutter --version && dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug sign)
        env:
          ANIME_FLOW_APP_ID: ${{ secrets.ANIME_FLOW_APP_ID }}
          ANIME_FLOW_SECRET: ${{ secrets.ANIME_FLOW_SECRET }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=ANIME_FLOW_APP_ID="$ANIME_FLOW_APP_ID" \
            --dart-define=ANIME_FLOW_SECRET="$ANIME_FLOW_SECRET"

      - name: List artifacts
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v6
        with:
          name: animeflow-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
