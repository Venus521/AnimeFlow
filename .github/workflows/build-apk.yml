name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (no secrets required)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Show versions
        run: flutter --version && dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug sign)
        env:
          ANIME_FLOW_APP_ID: ${{ secrets.ANIME_FLOW_APP_ID }}
          ANIME_FLOW_SECRET: ${{ secrets.ANIME_FLOW_SECRET }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=ANIME_FLOW_APP_ID="$ANIME_FLOW_APP_ID" \
            --dart-define=ANIME_FLOW_SECRET="$ANIME_FLOW_SECRET"

      - name: List artifacts
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v6
        with:
          name: animeflow-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # 发布到 Releases：App 内置的更新检查读的就是这里。
      # 文件名必须带 android，客户端的平台过滤只认这个关键字。
      - name: Publish release for in-app update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          TAG="v$VERSION"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "dist/animeflow-$VERSION-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/animeflow-$VERSION-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "dist/animeflow-$VERSION-android-x86_64.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "$VERSION" \
              --notes "自建版本 $VERSION：续播（自有记录）、WebDAV 同步、源批量导入与一键更新。"
          fi
